# JT-Code web (the built SPA). Rendered at container start by the nginx image's envsubst step
# (NGINX_ENVSUBST_FILTER=^JT_): ${JT_SUPABASE_ORIGIN} is the Supabase origin the browser talks to
# (e.g. https://supabase.example.com). Routing for /api belongs to the edge proxy, not to this server.
#
# The session (access + refresh token) lives in localStorage (supabase-js), so the CSP is the main
# defence against XSS turning into account takeover: scripts only from this origin and Stripe.js.

map $uri $jt_frame_ancestors {
    default "'none'";
    # Dashboard embeds are meant to be framed by other sites.
    ~^/embed/ "*";
}
map $uri $jt_frame_options {
    default "DENY";
    ~^/embed/ "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    set $jt_csp "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: ${JT_SUPABASE_ORIGIN} https://*.stripe.com; connect-src 'self' ${JT_SUPABASE_ORIGIN} https://api.stripe.com https://*.sentry.io; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $jt_frame_ancestors";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed build output: cache for a year.
    location /assets/ {
        include /etc/nginx/conf.d/jt-security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the SPA shell: always revalidate so a deploy is picked up immediately.
    location / {
        include /etc/nginx/conf.d/jt-security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
